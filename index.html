<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="%BASE_URL%">
  <script>
    // Single Page Apps for GitHub Pages — decodes the path 404.html encoded
    // into the query string and restores it via history.replaceState before
    // the app boots. https://github.com/rafgraph/spa-github-pages
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PAI EM Design</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      var t = localStorage.getItem('pai-theme');
      if (t === 'dark') document.documentElement.classList.add('theme-dark');
      else document.documentElement.classList.add('theme-light');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
